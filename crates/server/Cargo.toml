[package]
name = "amepricetrack"
version = "0.2.0"
edition = "2021"
description = "Self-hosted price tracker with deal alerts"
license = "0BSD"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "cookies", "form", "gzip", "http2", "json", "query", "rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "net"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["trace", "limit", "compression-gzip", "decompression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
flate2 = "1"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
