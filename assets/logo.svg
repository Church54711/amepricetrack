<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="t">
  <title id="t">AmePriceTrack: self-hosted price tracker</title>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="24" y1="24" x2="232" y2="232">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.45" stop-color="#e8b923"/>
      <stop offset="1" stop-color="#b07d0a"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0ad17"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" rx="36" fill="#000"/>
  <!-- The mark: a price tag holding the letter A, whose crossbar is a price stepping down. -->
  <g transform="translate(30 30) scale(0.625)">
    <path d="M56 12H170L244 86V200a44 44 0 0 1-44 44H56a44 44 0 0 1-44-44V56a44 44 0 0 1 44-44Z"
          fill="#000" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="186" cy="70" r="11" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M58 204 122 60 186 204" fill="none" stroke="url(#gold)" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 140H112L132 168H170" fill="none" stroke="url(#gold)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="218" y="118" font-size="68" font-weight="700" letter-spacing="-1.5">
      <tspan fill="url(#gold-text)">Ame</tspan><tspan fill="#f4f1e6">PriceTrack</tspan>
    </text>
    <text x="221" y="160" font-size="24" font-weight="400" fill="#9a9483" letter-spacing="0.4">Self-hosted price tracker</text>
  </g>
</svg>
